name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify PisoTab project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          elif [ -f "settings.gradle" ]; then
            echo "Found settings.gradle"
          else
            echo "ERROR: Gradle settings file not found."
            echo "Current directory:"
            pwd
            echo "Project files:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "PisoTab Gradle project verified."

      - name: Build PisoTab APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release
          cp "$APK" "release/PisoTab-DPC-Android11-16-debug.apk"

          ls -lh "release/PisoTab-DPC-Android11-16-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-DPC-Android11-16
          path: release/PisoTab-DPC-Android11-16-debug.apk
          if-no-files-found: error
