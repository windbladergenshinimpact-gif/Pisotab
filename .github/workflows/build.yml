name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        run: |
          set -e
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PisoTab v10 Small Icons
        run: |
          set -e
          rm -rf build_project
          mkdir -p build_project
          unzip -q -o "PisoTab_v10_ADDONLY_SWIPE_30_ICONS_SMALL.zip" -d build_project
          echo "Source extracted:"
          find build_project -maxdepth 2 -type f -print

      - name: Build PisoTab APK
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/build_project"
          echo "Building PisoTab v10 Small Icons..."
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-v10-small-icons
          path: build_project/app/build/outputs/apk/debug
