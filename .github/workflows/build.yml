name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract PisoTab source
        shell: bash
        run: |
          set -e

          ZIP="PisoTab_NonDeviceOwner_AdminLauncher_ActualAPK_Whitelist_Launcher_FIXED_BUILD_APK_v2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          rm -rf build_project
          mkdir -p build_project

          unzip -q "$ZIP" -d build_project

          echo "Extracted project:"
          find build_project -maxdepth 3 -type f | sort

      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd build_project

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project found."
          pwd
          ls -la

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd build_project

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "Gradle wrapper not included. Using installed Gradle."
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find build_project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-debug-apk
          path: build_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
