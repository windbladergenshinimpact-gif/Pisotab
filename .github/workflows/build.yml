name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          if [ -f "gradlew" ]; then
            echo "Project found at repository root"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "build_project/project/gradlew" ]; then
            echo "Project found at build_project/project"
            echo "PROJECT_DIR=build_project/project" >> "$GITHUB_ENV"
          else
            echo "ERROR: gradlew not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort |
