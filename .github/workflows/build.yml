name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check PisoTab project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo "Project contents:"
          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src

          echo "PisoTab project OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build PisoTab APK
        shell: bash
        run: |
          set -e

          echo "Starting PisoTab build..."

          gradle :app:assembleDebug --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Generated APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
