name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src

          echo "Gradle project found."

      - name: Build APK
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Building PisoTab..."
          ./gradlew :app:assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
