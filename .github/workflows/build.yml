name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PisoTab v10
        run: |
          set -e
          rm -rf build_project
          mkdir -p build_project
          unzip -q -o "PisoTab_v10_ADDONLY_SWIPE_30_ICONS_SOURCE_FIXED.zip" -d build_project
          echo "ZIP extracted successfully"
          ls -la build_project
          ls -la build_project/app

      - name: Build PisoTab
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/build_project"
          echo "Building PisoTab..."
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-v10-debug
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
