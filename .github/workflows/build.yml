name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd
          echo

          echo "Searching for Gradle project..."
          find . -maxdepth 5 -name settings.gradle -o -name settings.gradle.kts

      - name: Locate project
        shell: bash
        run: |
          set -e

          if [ -f "build_project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=build_project" >> "$GITHUB_ENV"
          elif [ -f "build_project/settings.gradle" ]; then
            echo "PROJECT_DIR=build_project" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle project not found."
            exit 1
          fi

      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          test -f gradlew
          chmod +x gradlew

          echo "Gradle project found."
          echo
          ls -la

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building PisoTab APK..."
          ./gradlew :app:assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
