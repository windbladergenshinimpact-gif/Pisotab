name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Prepare PisoTab project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="PisoTab_v10_ADDONLY_SWIPE_30_ICONS_SOURCE.zip"

          echo "Using source: $ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found: $ZIP"
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf build_project
          mkdir -p build_project

          unzip -q -o "$ZIP" -d build_project

          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            PROJECT_DIR="$(dirname "$settings_file")"
            break
          done < <(find build_project -type f -name "settings.gradle.kts" -o -name "settings.gradle" -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found."
            echo "Files inside package:"
            find build_project -maxdepth 6 -type f -print
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            echo "Project files:"
            find "$PROJECT_DIR" -maxdepth 4 -print
            exit 1
          fi

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify PisoTab files
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main"

          test -f "$MAIN/java/com/example/pisotab/MainActivity.kt"
          test -f "$MAIN/res/layout/activity_main.xml"

          echo "PisoTab launcher files found."

      - name: Build PisoTab APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
