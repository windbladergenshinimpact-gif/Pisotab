name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager 'platform-tools'
          sdkmanager 'platforms;android-35'
          sdkmanager 'build-tools;35.0.0'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract PisoTab v8
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          unzip -q -o \
            PisoTab_v8_DPC_ANDROID11_16_TINY_ICONS_30_PER_PAGE.zip \
            -d build_project

          echo 'PisoTab v8 extracted.'

          test -f build_project/settings.gradle.kts
          test -d build_project/app

          echo 'Gradle project verified.'

      - name: Build PisoTab APK
        shell: bash
        run: |
          set -e

          cd build_project

          echo 'Building PisoTab APK...'

          gradle clean assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e

          APK=$(find build_project/app/build/outputs -type f -name '*.apk' -print -quit)

          test -n "$APK"

          mkdir -p release

          cp "$APK" release/PisoTab-DPC-Android11-16-debug.apk

          echo 'APK created:'
          ls -lh release/PisoTab-DPC-Android11-16-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-DPC-Android11-16-APK
          path: release/PisoTab-DPC-Android11-16-debug.apk
          if-no-files-found: error
