name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Check source ZIP
        run: |
          echo "Checking repository..."
          ls -lah
          test -f "PisoTab_TOPLEFT_HOME_NO_SWIPE_SETTINGS_v7_SOURCE.zip"

      - name: Extract PisoTab source
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -
