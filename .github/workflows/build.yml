name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find PisoTab source ZIP
        shell: bash
        run: |
          set -e

          ZIP="PisoTab_TOPLEFT_HOME_NO_SWIPE_SETTINGS_v7_SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found."
            echo "Repository files:"
            ls -lah
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP"

      - name: Extract PisoTab source
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          unzip -q \
            "PisoTab_TOPLEFT_HOME_NO_SWIPE_SETTINGS_v7_SOURCE.zip" \
            -d build_project

          echo "Extracted source:"
          find build_project -maxdepth 3 -type f | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "build_project/settings.gradle.kts" ]; then
            PROJECT_DIR="build_project"
          elif
