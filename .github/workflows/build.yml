name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract PisoTab v10 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="PisoTab_v10_ADDONLY_SWIPE_30_ICONS_SOURCE.zip"

          echo "Using source: $ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found: $ZIP"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
