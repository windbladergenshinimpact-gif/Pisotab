name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager 'platform-tools'
          sdkmanager 'platforms;android-35'
          sdkmanager 'build-tools;35.0.0'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract PisoTab v9
        shell: bash
        run: |
          set -euo pipefail

          ZIP='PisoTab_COIN_ADMIN_DPC_ANDROID11_16_SOURCE_v9.zip'

          echo "Using source: $ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found: $ZIP"
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

          rm -rf build_project
          mkdir -p build_project

          unzip -q -o "$ZIP" -d build_project

          test -f build_project/settings.gradle.kts || \
            test -f build_project/settings.gradle

          test -d build_project/app

          echo "Gradle project verified."

      - name: Verify required PisoTab components
        shell: bash
        run: |
          set -euo pipefail

          find build_project/app/src/main \
            -type f \
            -name 'PisoTabDeviceAdminReceiver.kt' \
            -print -quit | grep -q .

          find build_project/app/src/main \
            -type f \
            -name 'pisotab_device_admin.xml' \
            -print -quit | grep -q .

          find build_project/app/src/main \
            -type f \
            -iname '*coin*' \
            -print -quit | grep -q .

          echo "Coin + DPC components found."

      - name: Build PisoTab APK
        shell: bash
        run: |
          set -euo pipefail

          cd build_project

          gradle clean assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find build_project/app/build/outputs \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/PisoTab-DPC-Android11-16-debug.apk

          ls -lh release/PisoTab-DPC-Android11-16-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-DPC-Android11-16
          path: release/PisoTab-DPC-Android11-16-debug.apk
          if-no-files-found: error
