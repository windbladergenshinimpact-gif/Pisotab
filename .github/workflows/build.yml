name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check source ZIP
        run: |
          echo "Checking repository..."
          ls -lah
          test -f "PisoTab_TOPLEFT_HOME_NO_SWIPE_SETTINGS_v7_SOURCE.zip"

      - name: Extract source
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q "PisoTab_TOPLEFT_HOME_NO_SWIPE_SETTINGS_v7_SOURCE.zip" -d build_project
          echo "Source extracted."
          find build_project -maxdepth 3 -type f | sort

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."

          find build_project -name "settings.gradle" -o -name "settings.gradle.kts"

          PROJECT_DIR=$(find build_project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle wrapper
        run: |
          echo "Gradle project: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

          test -f "$PROJECT_DIR/gradlew"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Show APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
