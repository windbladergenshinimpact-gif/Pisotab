name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build PisoTab APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building PisoTab APK..."
          echo "Gradle version:"
          gradle --version

          gradle clean assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/PisoTab-debug.apk

          echo "APK created:"
          ls -lh release/PisoTab-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-
