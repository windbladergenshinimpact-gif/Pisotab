name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare PisoTab source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="PisoTab_DPC_Android11_16_SOURCE_v8.zip"

          echo "Using source:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found."
            exit 1
          fi

          rm -rf build_project
          mkdir -p build_project

          unzip -q -o "$ZIP" -d build_project

          PROJECT_DIR=$(find build_project -type f \
            -name "settings.gradle.kts" -o -name "settings.gradle" \
            -printf "%h\n" | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found inside ZIP."
            find build_project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify PisoTab source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -lah

          test -f settings.gradle.kts || test -f settings.gradle
          test -d app

          echo "Gradle project verified."

      - name: Build PisoTab APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Building PisoTab APK..."

          grad
